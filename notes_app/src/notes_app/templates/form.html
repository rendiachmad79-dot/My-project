{% extends "base.html" %}
{% block title %}{{ 'Edit' if note else 'Baru' }} Catatan{% endblock %}
{% block heading %}{{ 'Edit' if note else 'Catatan Baru' }}{% endblock %}
{% block content %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <p>
      <label>Judul<br>
        <input type="text" name="title" value="{{ note.title if note else '' }}" required>
      </label>
    </p>
    <p>
      <label>Isi<br>
        <textarea name="body">{{ note.body if note else '' }}</textarea>
      </label>
    </p>
    <p>
      <button type="submit">Simpan</button>
      <a href="{{ url_for('index') }}">Batal</a>
    </p>
  </form>
{% endblock %}
