{% extends "base.html" %}
{% block content %}
  <p><a href="{{ url_for('new_note') }}">+ Catatan baru</a></p>
  {% if notes %}
    {% for note in notes %}
      <article class="note">
        <h2>{{ note.title }}</h2>
        <p class="meta">{{ note.created_at }}</p>
        <p>{{ note.body }}</p>
        <div class="actions">
          <a href="{{ url_for('edit_note', note_id=note.id) }}">Edit</a>
          <form method="post" action="{{ url_for('delete_note', note_id=note.id) }}" style="display:inline">
            <button type="submit" onclick="return confirm('Hapus catatan ini?')">Hapus</button>
          </form>
        </div>
      </article>
    {% endfor %}
  {% else %}
    <p>Belum ada catatan.</p>
  {% endif %}
{% endblock %}
